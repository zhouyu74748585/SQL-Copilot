drivers:
  POSTGRESQL:
    displayName: "PostgreSQL"
    defaultPort: 5432
    supportsSelectedDatabases: true
    defaultVersion: "16"
    defaultDriver: "org.postgresql.Driver"
    resourcePattern: "drivers/{type}/{version}/driver.jar"
    driversByVersion:
      "16": "org.postgresql.Driver"
      "15": "org.postgresql.Driver"
      "14": "org.postgresql.Driver"
      "13": "org.postgresql.Driver"
      "12": "org.postgresql.Driver"
    resourceAliases:
      "16": "universal"
      "15": "universal"
      "14": "universal"
      "13": "universal"
      "12": "universal"
    introspection:
      schemas: |-
        select datname as schema_name
          from pg_database
         where datistemplate = false
         order by datname
      tables: |-
        select n.nspname as table_schema,
               c.relname as table_name,
               coalesce(obj_description(c.oid, 'pg_class'), '') as table_comment
          from pg_class c
          join pg_namespace n
            on n.oid = c.relnamespace
         where c.relkind = 'r'
           and n.nspname = current_schema()
         order by c.relname
      columns: |-
        select column_name,
               data_type,
               is_nullable,
               character_maximum_length,
               numeric_precision,
               numeric_scale,
               column_default,
               case
                 when column_default like 'nextval(%'
                   or is_identity = 'YES' then 'YES'
                 else 'NO'
               end as is_auto_increment,
               pg_catalog.col_description(format('%I.%I', table_schema, table_name)::regclass::oid, ordinal_position) as column_comment
          from information_schema.columns
         where table_schema = current_schema()
           and table_name = {table_literal}
         order by ordinal_position
      primaryKeys: |-
        select kcu.column_name
          from information_schema.table_constraints tc
          join information_schema.key_column_usage kcu
            on tc.constraint_name = kcu.constraint_name
           and tc.table_schema = kcu.table_schema
           and tc.table_name = kcu.table_name
         where tc.constraint_type = 'PRIMARY KEY'
           and tc.table_schema = current_schema()
           and tc.table_name = {table_literal}
         order by kcu.ordinal_position
    pagination:
      preview: |-
        select *
          from (
                {sql}
               ) t
         limit {limit} offset {offset}
      ingestion: |-
        {sql}
        limit ?
    tableCopy:
      createTableSql: |-
        select sql as ddl
          from (
                select 'CREATE TABLE ' || quote_ident(c.relname) || E' (\n'
                       || string_agg(
                            '    ' || quote_ident(a.attname) || ' ' || format_type(a.atttypid, a.atttypmod)
                            || case when a.attnotnull then ' NOT NULL' else '' end
                            || case when ad.adbin is not null then ' DEFAULT ' || pg_get_expr(ad.adbin, ad.adrelid) else '' end,
                            E',\n'
                            order by a.attnum
                          )
                       || coalesce(
                            (
                                select E',\n    PRIMARY KEY (' || string_agg(quote_ident(kcu.column_name), ', ' order by kcu.ordinal_position) || ')'
                                  from information_schema.table_constraints tc
                                  join information_schema.key_column_usage kcu
                                    on tc.constraint_name = kcu.constraint_name
                                   and tc.table_schema = kcu.table_schema
                                    and tc.table_name = kcu.table_name
                                 where tc.constraint_type = 'PRIMARY KEY'
                                   and tc.table_schema = current_schema()
                                   and tc.table_name = {source_table_literal}
                            ),
                            ''
                          )
                       || E'\n)' as sql
                  from pg_class c
                  join pg_namespace n on n.oid = c.relnamespace
                  join pg_attribute a on a.attrelid = c.oid and a.attnum > 0 and not a.attisdropped
                  left join pg_attrdef ad on ad.adrelid = a.attrelid and ad.adnum = a.attnum
                 where n.nspname = current_schema()
                   and c.relname = {source_table_literal}
                 group by c.relname
               ) ddl
      ddlColumnLabel: "ddl"
      structureOnlySameDatabaseSql: |-
        create table {quoted_target_table} (like {quoted_source_table} including all)
      structureAndDataSameDatabaseSql: |-
        create table {quoted_target_table} (like {quoted_source_table} including all);
        insert into {quoted_target_table} select * from {quoted_source_table}
    tableOperations:
      renameTableSql: |-
        alter table {quoted_source_table} rename to {quoted_target_table}
    namespace:
      label: "数据库"
      createSql: |-
        create database {quoted_target_namespace}
      renameSql: |-
        alter database {quoted_source_namespace} rename to {quoted_target_namespace}
      dropSql: |-
        drop database if exists {quoted_source_namespace}
    objectDefinitions:
      view:
        fetchSql: |-
          select 'create or replace view ' || quote_ident(c.relname) || E' as\n' || pg_get_viewdef(c.oid, true) as definition_sql
            from pg_class c
            join pg_namespace n
              on n.oid = c.relnamespace
           where c.relkind = 'v'
             and n.nspname = current_schema()
             and c.relname = {object_literal}
        fetchColumnLabel: "definition_sql"
        saveStrategy: "REPLACE"
        replaceSql: |-
          {definition_sql}
        dropSql: |-
          drop view if exists {quoted_object_name}
      function:
        fetchSql: |-
          select pg_get_functiondef(p.oid) as definition_sql
            from pg_proc p
            join pg_namespace n
              on n.oid = p.pronamespace
           where n.nspname = current_schema()
             and p.proname = {object_literal}
           order by p.oid
           limit 1
        fetchColumnLabel: "definition_sql"
        saveStrategy: "REPLACE"
        replaceSql: |-
          {definition_sql}
        dropSql: |-
          drop function if exists {quoted_object_name}
  MYSQL:
    displayName: "MySQL"
    defaultPort: 3306
    supportsSelectedDatabases: true
    defaultVersion: "8.0"
    defaultDriver: "com.mysql.cj.jdbc.Driver"
    resourcePattern: "drivers/{type}/{version}/driver.jar"
    driversByVersion:
      "8.0": "com.mysql.cj.jdbc.Driver"
      "5.7": "com.mysql.jdbc.Driver"
    resourceAliases:
      "8.0": "8.x"
      "5.7": "5.7"
    introspection:
      schemas: |-
        select schema_name
          from information_schema.schemata
         order by schema_name
      tables: |-
        select table_schema, table_name, table_comment
          from information_schema.tables
         where table_type = 'BASE TABLE'
           and table_schema = ?
         order by table_name
      columns: |-
        select column_name,
               data_type,
               is_nullable,
               character_maximum_length,
               numeric_precision,
               numeric_scale,
               column_default,
               case
                 when extra like '%auto_increment%' then 'YES'
                 else 'NO'
               end as is_auto_increment,
               extra as column_extra,
               column_comment
          from information_schema.columns
         where table_schema = ?
           and table_name = ?
         order by ordinal_position
      primaryKeys: |-
        select k.COLUMN_NAME
          from information_schema.table_constraints t
          join information_schema.key_column_usage k
            on t.constraint_name = k.constraint_name
           and t.table_schema = k.table_schema
           and t.table_name = k.table_name
         where t.constraint_type = 'PRIMARY KEY'
           and t.table_schema = ?
           and t.table_name = ?
         order by k.ordinal_position
    pagination:
      preview: |-
        select *
          from (
                {sql}
               ) t
         limit {limit} offset {offset}
      ingestion: |-
        {sql}
        limit ?
    tableCopy:
      createTableSql: |-
        show create table {quoted_source_table}
      ddlColumnIndex: 2
      structureOnlySameDatabaseSql: |-
        create table {quoted_target_table} like {quoted_source_table}
      structureAndDataSameDatabaseSql: |-
        create table {quoted_target_table} like {quoted_source_table};
        insert into {quoted_target_table} select * from {quoted_source_table}
      structureOnlyCrossDatabaseSql: |-
        create table {qualified_target_table} like {qualified_source_table}
      structureAndDataCrossDatabaseSql: |-
        create table {qualified_target_table} like {qualified_source_table};
        insert into {qualified_target_table} select * from {qualified_source_table}
    tableOperations:
      renameTableSql: |-
        rename table {quoted_source_table} to {quoted_target_table}
    namespace:
      label: "数据库"
      createSql: |-
        create database {quoted_target_namespace}
      dropSql: |-
        drop database if exists {quoted_source_namespace}
    objectDefinitions:
      view:
        fetchSql: |-
          show create view {quoted_object_name}
        fetchColumnIndex: 2
        saveStrategy: "DROP_CREATE"
        replaceSql: |-
          {definition_sql}
        dropSql: |-
          drop view if exists {quoted_object_name}
      function:
        fetchSql: |-
          show create function {quoted_object_name}
        fetchColumnIndex: 3
        saveStrategy: "DROP_CREATE"
        replaceSql: |-
          {definition_sql}
        dropSql: |-
          drop function if exists {quoted_object_name}
  SQLITE:
    displayName: "SQLite"
    defaultPort: 0
    supportsSelectedDatabases: false
    defaultVersion: "universal"
    defaultDriver: "org.sqlite.JDBC"
    resourcePattern: "drivers/{type}/{version}/driver.jar"
    driversByVersion:
      "universal": "org.sqlite.JDBC"
    resourceAliases:
      "universal": "universal"
    introspection:
      schemas: |-
        select 'main' as schema_name
      tables: |-
        select 'main' as table_schema,
               name as table_name,
               '' as table_comment
          from sqlite_master
         where type = 'table'
           and name not like 'sqlite_%'
         order by name
      columns: |-
        select p.name as column_name,
               lower(p.type) as data_type,
               case
                 when p."notnull" = 1 then 'NO'
                 else 'YES'
               end as is_nullable,
               null as character_maximum_length,
               null as numeric_precision,
               null as numeric_scale,
               p.dflt_value as column_default,
               'NO' as is_auto_increment,
               '' as column_comment
          from pragma_table_info({table_literal}) p
         order by p.cid
      primaryKeys: |-
        select p.name as column_name
          from pragma_table_info({table_literal}) p
         where p.pk > 0
         order by p.pk
    tableCopy:
      createTableSql: |-
        select sql as ddl
          from sqlite_master
         where type = 'table'
           and name = {source_table_literal}
      ddlColumnLabel: "ddl"
    tableOperations:
      renameTableSql: |-
        alter table {quoted_source_table} rename to {quoted_target_table}
    objectDefinitions:
      view:
        fetchSql: |-
          select sql as definition_sql
            from sqlite_master
           where type = 'view'
             and name = {object_literal}
        fetchColumnLabel: "definition_sql"
        saveStrategy: "DROP_CREATE"
        replaceSql: |-
          {definition_sql}
        dropSql: |-
          drop view if exists {quoted_object_name}
  ORACLE:
    displayName: "Oracle"
    defaultPort: 1521
    supportsSelectedDatabases: true
    defaultVersion: "19c"
    defaultDriver: "oracle.jdbc.OracleDriver"
    resourcePattern: "drivers/{type}/{version}/driver.jar"
    driversByVersion:
      "19c": "oracle.jdbc.OracleDriver"
      "12c": "oracle.jdbc.OracleDriver"
      "11g": "oracle.jdbc.OracleDriver"
    resourceAliases:
      "19c": "universal"
      "12c": "universal"
      "11g": "universal"
    introspection:
      schemas: |-
        select username as schema_name
          from all_users
         order by username
      tables: |-
        select owner as table_schema,
               table_name,
               comments as table_comment
          from all_tab_comments
         where owner = ?
           and table_type = 'TABLE'
         order by table_name
      columns: |-
        select col.column_name,
               col.data_type,
               case
                 when col.nullable = 'Y' then 'YES'
                 else 'NO'
               end as is_nullable,
               col.data_length as character_maximum_length,
               col.data_precision as numeric_precision,
               col.data_scale as numeric_scale,
               cast(null as varchar2(4000)) as column_default,
               case
                 when idc.column_name is not null then 'YES'
                 else 'NO'
               end as is_auto_increment,
               c.comments as column_comment
          from all_tab_columns col
          left join all_col_comments c
            on c.owner = col.owner
           and c.table_name = col.table_name
           and c.column_name = col.column_name
          left join all_tab_identity_cols idc
            on idc.owner = col.owner
           and idc.table_name = col.table_name
           and idc.column_name = col.column_name
         where col.owner = ?
           and col.table_name = ?
         order by col.column_id
      primaryKeys: |-
        select col.column_name
          from all_constraints con
          join all_cons_columns col
            on con.constraint_name = col.constraint_name
           and con.owner = col.owner
         where con.constraint_type = 'P'
           and con.owner = ?
           and con.table_name = ?
         order by col.position
    tableCopy:
      createTableSql: |-
        select dbms_metadata.get_ddl('TABLE', {source_table_literal}, sys_context('USERENV', 'CURRENT_SCHEMA')) as ddl
          from dual
      ddlColumnLabel: "ddl"
    tableOperations:
      renameTableSql: |-
        alter table {quoted_source_table} rename to {quoted_target_table}
    namespace:
      label: "Schema"
    objectDefinitions:
      view:
        fetchSql: |-
          select dbms_metadata.get_ddl('VIEW', {object_literal}, sys_context('USERENV', 'CURRENT_SCHEMA')) as definition_sql
            from dual
        fetchColumnLabel: "definition_sql"
        saveStrategy: "DROP_CREATE"
        replaceSql: |-
          {definition_sql}
        dropSql: |-
          drop view {quoted_object_name}
      function:
        fetchSql: |-
          select dbms_metadata.get_ddl('FUNCTION', {object_literal}, sys_context('USERENV', 'CURRENT_SCHEMA')) as definition_sql
            from dual
        fetchColumnLabel: "definition_sql"
        saveStrategy: "DROP_CREATE"
        replaceSql: |-
          {definition_sql}
        dropSql: |-
          drop function {quoted_object_name}
  SQLSERVER:
    displayName: "SQL Server"
    defaultPort: 1433
    supportsSelectedDatabases: true
    defaultVersion: "2019"
    defaultDriver: "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    resourcePattern: "drivers/{type}/{version}/driver.jar"
    driversByVersion:
      "2019": "com.microsoft.sqlserver.jdbc.SQLServerDriver"
      "2016": "com.microsoft.sqlserver.jdbc.SQLServerDriver"
      "2012": "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    resourceAliases:
      "2019": "universal"
      "2016": "universal"
      "2012": "universal"
    introspection:
      schemas: |-
        select name as schema_name
          from sys.schemas
         where principal_id < 16384
           and name not in ('sys', 'guest', 'INFORMATION_SCHEMA')
         order by name
      tables: |-
        select s.name as table_schema,
               t.name as table_name,
               cast(ep.value as nvarchar(500)) as table_comment
          from sys.tables t
          join sys.schemas s
            on t.schema_id = s.schema_id
          outer apply (
              select ep.value
                from sys.extended_properties ep
               where ep.major_id = t.object_id
                 and ep.minor_id = 0
                 and ep.name = 'MS_Description'
          ) ep
         where s.name = ?
         order by t.name
      columns: |-
        select s.name as table_schema,
               t.name as table_name,
               c.name as column_name,
               type_name(c.user_type_id) as data_type,
               case when c.is_nullable = 1 then 'YES' else 'NO' end as is_nullable,
               c.max_length as character_maximum_length,
               c.precision as numeric_precision,
               c.scale as numeric_scale,
               dc.definition as column_default,
               case when c.is_identity = 1 then 'YES' else 'NO' end as is_auto_increment,
               cast(ep.value as nvarchar(500)) as column_comment
          from sys.columns c
          join sys.tables t
            on c.object_id = t.object_id
          join sys.schemas s
            on t.schema_id = s.schema_id
          left join sys.default_constraints dc
            on dc.parent_object_id = c.object_id
           and dc.parent_column_id = c.column_id
          outer apply (
              select ep.value
                from sys.extended_properties ep
               where ep.major_id = t.object_id
                 and ep.minor_id = c.column_id
                 and ep.name = 'MS_Description'
          ) ep
         where s.name = ?
           and t.name = ?
         order by c.column_id
      primaryKeys: |-
        select c.name
          from sys.indexes i
          join sys.index_columns ic
            on i.object_id = ic.object_id
           and i.index_id = ic.index_id
          join sys.columns c
            on ic.object_id = c.object_id
           and ic.column_id = c.column_id
          join sys.tables t
            on i.object_id = t.object_id
          join sys.schemas s
            on t.schema_id = s.schema_id
         where i.is_primary_key = 1
           and s.name = ?
           and t.name = ?
         order by ic.key_ordinal
    pagination:
      preview: |-
        select *
          from (
                {sql}
               ) t
         order by (select 0)
         offset {offset} rows fetch next {limit} rows only
      ingestion: |-
        {sql}
        offset 0 rows fetch next ? rows only
    tableOperations:
      renameTableSql: |-
        exec sp_rename {source_full_name_literal}, {target_table_literal}
    namespace:
      label: "Schema"
      createSql: |-
        exec('create schema {target_namespace}')
      dropSql: |-
        drop schema {quoted_source_namespace}
    objectDefinitions:
      view:
        fetchSql: |-
          select object_definition(object_id(quotename(schema_name()) + '.' + quotename({object_literal}))) as definition_sql
        fetchColumnLabel: "definition_sql"
        saveStrategy: "DROP_CREATE"
        replaceSql: |-
          {definition_sql}
        dropSql: |-
          drop view if exists {quoted_object_name}
      function:
        fetchSql: |-
          select object_definition(object_id(quotename(schema_name()) + '.' + quotename({object_literal}))) as definition_sql
        fetchColumnLabel: "definition_sql"
        saveStrategy: "DROP_CREATE"
        replaceSql: |-
          {definition_sql}
        dropSql: |-
          drop function if exists {quoted_object_name}
