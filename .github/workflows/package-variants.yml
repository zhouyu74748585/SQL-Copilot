name: Package App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
            artifact_paths: |
              release/desktop/win-x64/*.exe
              release/desktop/win-x64/*.blockmap
          - os: macos-14
            target: mac-arm64
            artifact_paths: |
              release/desktop/mac-arm64/*.zip
          - os: macos-15-intel
            target: mac-x64
            artifact_paths: |
              release/desktop/mac-x64/*.zip
          - os: ubuntu-latest
            target: linux-x64
            artifact_paths: |
              release/desktop/linux-x64/*.tar.gz

    env:
      CI: "true"
      SQLCOPILOT_MAC_SIGN: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Package target artifact
        run: node scripts/package-variants.mjs --targets=${{ matrix.target }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sql-copilot-${{ matrix.target }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
