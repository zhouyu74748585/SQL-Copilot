  SQLSERVER:
    displayName: "SQL Server"
    defaultVersion: "2019"
    defaultDriver: "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    resourcePattern: "drivers/{type}/{version}/driver.jar"
    driversByVersion:
      "2019": "com.microsoft.sqlserver.jdbc.SQLServerDriver"
      "2016": "com.microsoft.sqlserver.jdbc.SQLServerDriver"
      "2012": "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    resourceAliases:
      "2019": "universal"
      "2016": "universal"
      "2012": "universal"
    introspection:
      schemas: |-
        select name as schema_name
          from sys.schemas
         where principal_id < 16384
           and name not in ('sys', 'guest', 'INFORMATION_SCHEMA')
         order by name
      tables: |-
        select s.name as table_schema,
               t.name as table_name,
               cast(ep.value as nvarchar(500)) as table_comment
          from sys.tables t
          join sys.schemas s
            on t.schema_id = s.schema_id
          outer apply (
              select ep.value
                from sys.extended_properties ep
               where ep.major_id = t.object_id
                 and ep.minor_id = 0
                 and ep.name = 'MS_Description'
          ) ep
         where s.name = ?
         order by t.name
      columns: |-
        select s.name as table_schema,
               t.name as table_name,
               c.name as column_name,
               type_name(c.user_type_id) as data_type,
               case when c.is_nullable = 1 then 'YES' else 'NO' end as is_nullable,
               c.max_length as character_maximum_length,
               c.precision as numeric_precision,
               c.scale as numeric_scale,
               cast(ep.value as nvarchar(500)) as column_comment
          from sys.columns c
          join sys.tables t
            on c.object_id = t.object_id
          join sys.schemas s
            on t.schema_id = s.schema_id
          outer apply (
              select ep.value
                from sys.extended_properties ep
               where ep.major_id = t.object_id
                 and ep.minor_id = c.column_id
                 and ep.name = 'MS_Description'
          ) ep
         where s.name = ?
           and t.name = ?
         order by c.column_id
      primaryKeys: |-
        select c.name
          from sys.indexes i
          join sys.index_columns ic
            on i.object_id = ic.object_id
           and i.index_id = ic.index_id
          join sys.columns c
            on ic.object_id = c.object_id
           and ic.column_id = c.column_id
          join sys.tables t
            on i.object_id = t.object_id
          join sys.schemas s
            on t.schema_id = s.schema_id
         where i.is_primary_key = 1
           and s.name = ?
           and t.name = ?
         order by ic.key_ordinal
    pagination:
      preview: |-
        select *
          from (
                {sql}
               ) t
         order by (select 0)
         offset {offset} rows fetch next {limit} rows only
      ingestion: |-
        {sql}
        offset 0 rows fetch next ? rows only
