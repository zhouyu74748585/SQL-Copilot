drivers:
  POSTGRESQL:
    displayName: "PostgreSQL"
    defaultVersion: "16"
    defaultDriver: "org.postgresql.Driver"
    resourcePattern: "drivers/{type}/{version}/driver.jar"
    driversByVersion:
      "16": "org.postgresql.Driver"
      "15": "org.postgresql.Driver"
      "14": "org.postgresql.Driver"
      "13": "org.postgresql.Driver"
      "12": "org.postgresql.Driver"
    resourceAliases:
      "16": "universal"
      "15": "universal"
      "14": "universal"
      "13": "universal"
      "12": "universal"
    introspection:
      schemas: |-
        select datname as schema_name
          from pg_database
         where datistemplate = false
         order by datname
      tables: |-
        select n.nspname as table_schema,
               c.relname as table_name,
               coalesce(obj_description(c.oid, 'pg_class'), '') as table_comment
          from pg_class c
          join pg_namespace n
            on n.oid = c.relnamespace
         where c.relkind = 'r'
           and n.nspname = current_schema()
         order by c.relname
      columns: |-
        select column_name,
               data_type,
               is_nullable,
               character_maximum_length,
               numeric_precision,
               numeric_scale,
               column_default,
               case
                 when column_default like 'nextval(%'
                   or is_identity = 'YES' then 'YES'
                 else 'NO'
               end as is_auto_increment,
               pg_catalog.col_description(format('%I.%I', table_schema, table_name)::regclass::oid, ordinal_position) as column_comment
          from information_schema.columns
         where table_schema = current_schema()
           and table_name = {table_literal}
         order by ordinal_position
      primaryKeys: |-
        select kcu.column_name
          from information_schema.table_constraints tc
          join information_schema.key_column_usage kcu
            on tc.constraint_name = kcu.constraint_name
           and tc.table_schema = kcu.table_schema
           and tc.table_name = kcu.table_name
         where tc.constraint_type = 'PRIMARY KEY'
           and tc.table_schema = current_schema()
           and tc.table_name = {table_literal}
         order by kcu.ordinal_position
    pagination:
      preview: |-
        select *
          from (
                {sql}
               ) t
         limit {limit} offset {offset}
      ingestion: |-
        {sql}
        limit ?
    tableCopy:
      createTableSql: |-
        select sql as ddl
          from (
                select 'CREATE TABLE ' || quote_ident(c.relname) || E' (\n'
                       || string_agg(
                            '    ' || quote_ident(a.attname) || ' ' || format_type(a.atttypid, a.atttypmod)
                            || case when a.attnotnull then ' NOT NULL' else '' end
                            || case when ad.adbin is not null then ' DEFAULT ' || pg_get_expr(ad.adbin, ad.adrelid) else '' end,
                            E',\n'
                            order by a.attnum
                          )
                       || coalesce(
                            (
                                select E',\n    PRIMARY KEY (' || string_agg(quote_ident(kcu.column_name), ', ' order by kcu.ordinal_position) || ')'
                                  from information_schema.table_constraints tc
                                  join information_schema.key_column_usage kcu
                                    on tc.constraint_name = kcu.constraint_name
                                   and tc.table_schema = kcu.table_schema
                                    and tc.table_name = kcu.table_name
                                 where tc.constraint_type = 'PRIMARY KEY'
                                   and tc.table_schema = current_schema()
                                   and tc.table_name = {source_table_literal}
                            ),
                            ''
                          )
                       || E'\n)' as sql
                  from pg_class c
                  join pg_namespace n on n.oid = c.relnamespace
                  join pg_attribute a on a.attrelid = c.oid and a.attnum > 0 and not a.attisdropped
                  left join pg_attrdef ad on ad.adrelid = a.attrelid and ad.adnum = a.attnum
                 where n.nspname = current_schema()
                   and c.relname = {source_table_literal}
                 group by c.relname
               ) ddl
      ddlColumnLabel: "ddl"
      structureOnlySameDatabaseSql: |-
        create table {quoted_target_table} (like {quoted_source_table} including all)
      structureAndDataSameDatabaseSql: |-
        create table {quoted_target_table} (like {quoted_source_table} including all);
        insert into {quoted_target_table} select * from {quoted_source_table}
    tableOperations:
      renameTableSql: |-
        alter table {quoted_source_table} rename to {quoted_target_table}
  MYSQL:
    displayName: "MySQL"
    defaultVersion: "8.0"
    defaultDriver: "com.mysql.cj.jdbc.Driver"
    resourcePattern: "drivers/{type}/{version}/driver.jar"
    driversByVersion:
      "8.0": "com.mysql.cj.jdbc.Driver"
      "5.7": "com.mysql.jdbc.Driver"
    resourceAliases:
      "8.0": "8.x"
      "5.7": "5.7"
    introspection:
      schemas: |-
        select schema_name
          from information_schema.schemata
         order by schema_name
      tables: |-
        select table_schema, table_name, table_comment
          from information_schema.tables
         where table_type = 'BASE TABLE'
           and table_schema = ?
         order by table_name
      columns: |-
        select column_name,
               data_type,
               is_nullable,
               character_maximum_length,
               numeric_precision,
               numeric_scale,
               column_default,
               case
                 when extra like '%auto_increment%' then 'YES'
                 else 'NO'
               end as is_auto_increment,
               extra as column_extra,
               column_comment
          from information_schema.columns
         where table_schema = ?
           and table_name = ?
         order by ordinal_position
      primaryKeys: |-
        select k.COLUMN_NAME
          from information_schema.table_constraints t
          join information_schema.key_column_usage k
            on t.constraint_name = k.constraint_name
           and t.table_schema = k.table_schema
           and t.table_name = k.table_name
         where t.constraint_type = 'PRIMARY KEY'
           and t.table_schema = ?
           and t.table_name = ?
         order by k.ordinal_position
    pagination:
      preview: |-
        select *
          from (
                {sql}
               ) t
         limit {limit} offset {offset}
      ingestion: |-
        {sql}
        limit ?
    tableCopy:
      createTableSql: |-
        show create table {quoted_source_table}
      ddlColumnIndex: 2
      structureOnlySameDatabaseSql: |-
        create table {quoted_target_table} like {quoted_source_table}
      structureAndDataSameDatabaseSql: |-
        create table {quoted_target_table} like {quoted_source_table};
        insert into {quoted_target_table} select * from {quoted_source_table}
      structureOnlyCrossDatabaseSql: |-
        create table {qualified_target_table} like {qualified_source_table}
      structureAndDataCrossDatabaseSql: |-
        create table {qualified_target_table} like {qualified_source_table};
        insert into {qualified_target_table} select * from {qualified_source_table}
    tableOperations:
      renameTableSql: |-
        rename table {quoted_source_table} to {quoted_target_table}
